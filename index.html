let currentLanguage="de";

let activeCollection=null;

let activeProduct=null;

function t(key){

return translations[currentLanguage]?.[key]||

translations.de[key]||key;

}

function collectionName(product){

if(product.name)return product.name;

if(["MM071","MM072","MM073","MM074","MM075"].includes(product.code))return t("mascaraName");

if(product.code.startsWith("MM016")||product.code.startsWith("MM017")||

product.code.startsWith("MM018")||product.code.startsWith("MM019")||

product.code.startsWith("MM020")||product.code.startsWith("MM021")||

product.code.startsWith("MM022")||product.code.startsWith("MM023"))return t("eyeName");

if(product.code.startsWith("MKOM36")||product.code.startsWith("MKOM37")||

product.code.startsWith("MKOM38"))return t("diamondName");

if(product.code.startsWith("MKOM"))return t("shadowName");

if(product.code.startsWith("MKPL"))return t("paletteName");

if(product.code.startsWith("MM03")||product.code.startsWith("MM04"))return t("sticksName");

if(product.code.startsWith("LM")||product.code.startsWith("MM00"))return t("foundationName");

if(product.code.startsWith("COR"))return t("concealerName");

if(product.code.startsWith("CPR")||product.code.startsWith("FRD")||

product.code.startsWith("TER")||product.code.startsWith("MKILL"))return t("powdersName");

return t("viewProducts");

}

function whatsappLink(product){

const message="Hallo, ich interessiere mich für "+collectionName(product)+

", Artikel "+product.code+".";

return "https://wa.me/"+WA+"?text="+encodeURIComponent(message);

}

function openGallery(id){

const collection=collections[id];

if(!collection)return;

activeCollection=collection;

activeProduct=null;

document.getElementById("galleryTitle").textContent=t(collection.titleKey);

document.getElementById("galleryInstruction").textContent=t("choose");

const overview=document.getElementById("galleryOverview");

overview.style.display="block";

overview.src=asset(collection.folder,collection.overview);

overview.alt=t(collection.titleKey);

overview.onerror=function(){this.style.display="none";};

overview.onload=function(){this.style.display="block";};

const grid=document.getElementById("galleryProducts");

grid.innerHTML=collection.products.map((product,index)=>{

const image=asset(collection.folder,product.file);

const name=collectionName(product);

return `

<article class="product">

<img src="${image}" loading="lazy" alt="${name}" onerror="this.alt='Image not available';this.style.opacity='.35'">

<button type="button" class="detail-btn" onclick="openDetail(${index})">${t("details")}</button>

</article>

`;

}).join("");

document.getElementById("galleryModal").classList.add("open");

document.body.style.overflow="hidden";

}

function closeGallery(){

document.getElementById("galleryModal").classList.remove("open");

document.body.style.overflow="";

}

function closeGalleryOutside(event){

if(event.target.id==="galleryModal")closeGallery();

}

function openDetail(index){

if(!activeCollection)return;

const product=activeCollection.products[index];

if(!product)return;

activeProduct=product;

document.getElementById("detailTitle").textContent=collectionName(product);

document.getElementById("detailImage").src=asset(activeCollection.folder,product.file);

document.getElementById("detailImage").alt=collectionName(product);

document.getElementById("detailDescription").textContent=t("description");

document.getElementById("detailWhatsApp").href=whatsappLink(product);

document.getElementById("detailModal").classList.add("open");

}

function closeDetail(){

document.getElementById("detailModal").classList.remove("open");

}

function closeDetailOutside(event){

if(event.target.id==="detailModal")closeDetail();

}

function changeLanguage(lang){

if(!translations[lang])lang="de";

currentLanguage=lang;

document.documentElement.lang=lang;

document.getElementById("language").value=lang;

document.getElementById("introTitle").textContent=t("intro");

document.getElementById("introText").textContent=t("introText");

document.getElementById("footerText").textContent=t("footer");

document.getElementById("footerBrand").textContent=t("footerBrand");

document.querySelectorAll("[data-i18n]").forEach(el=>{

el.textContent=t(el.dataset.i18n);

});

if(activeCollection&&document.getElementById("galleryModal").classList.contains("open")){

const id=Object.keys(collections).find(key=>collections[key]===activeCollection);

if(id)openGallery(id);

}

if(activeProduct&&document.getElementById("detailModal").classList.contains("open")){

document.getElementById("detailTitle").textContent=collectionName(activeProduct);

document.getElementById("detailDescription").textContent=t("description");

document.getElementById("detailWhatsApp").href=whatsappLink(activeProduct);

}

}

document.getElementById("language").addEventListener("change",function(){

changeLanguage(this.value);

});

document.addEventListener("keydown",function(event){

if(event.key==="Escape"){

closeDetail();

closeGallery();

}

});

changeLanguage("de");

</script>

</body>

</html>
