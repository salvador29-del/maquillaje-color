let currentLanguage="de";

let activeCollection=null;

function t(key){

return translations[currentLanguage][key]||translations.de[key]||key;

}

function productName(product){

if(product.name)return product.name;

if(product.code.startsWith("MKOM36")||product.code.startsWith("MKOM37")||product.code.startsWith("MKOM38"))return t("diamondName");

if(product.code.startsWith("MKOM"))return t("shadowName");

if(product.code.startsWith("MM07"))return t("mascaraName");

if(product.code.startsWith("COR"))return t("concealerTitle");

if(product.code.startsWith("MKPL"))return t("paletteTitle");

return t("foundationTitle");

}

function whatsappLink(product){

const message="Hallo, ich interessiere mich für Artikel "+product.code+".";

return "https://wa.me/"+WA+"?text="+encodeURIComponent(message);

}

function collectionSubtitle(id){

const map={

mascaras:"mascaraSub",

eyestay:"eyeSub",

sombras1:"shadowSub",

sombras2:"shadowSub",

sombras3:"shadowSub",

diamond:"diamondSub",

palettes:"paletteSub",

sticks:"sticksSub",

foundation:"foundationSub",

powders:"powderSub",

concealers:"concealerSub"

};

return t(map[id]);

}

function renderSections(){

const root=document.getElementById("collectionsRoot");

const order=["mascaras","eyestay","sombras1","sombras2","sombras3","diamond","palettes","sticks","foundation","powders","concealers"];

root.innerHTML=order.map(id=>{

const c=collections[id];

const videoFiles={

mascaras:"01_maquillajes_ojos/01_Coleccion_Mascaras_Pestanas/Moniamori_Mascaras_Samba_Texto.mp4",

eyestay:"01_maquillajes_ojos/02_ Extra_EyeStay/Extra_EyeStay_8_Colores_60s_CORREGIDO.mp4",

sombras1:"01_maquillajes_ojos/03_ Sombra_de_ojos_en_polvo_prensado/Maquillajes_y_Colores_Elegante_Limpio.mp4",

diamond:"01_maquillajes_ojos/04_ Sombra_de_ojos_Diamond_Cream/diamond_cream_tres_tonos_30s.mp4",

palettes:"01_maquillajes_ojos/05_ Paleta_de_sombras_de_ojos_9_Colores/paletas_sombras_video_elegante.mp4",

sticks:"02_maquillajes_rostro/01_Sticks_ Multifuncion/MONIAMORI_VIDEO_COMPATIBLE_IPHONE_45s.mp4",

foundation:"02_maquillajes_rostro/02_Bases_de_Maquillajes/VIDEO_BASES_MAQUILLAJE_60_SEGUNDOS.mp4",

powders:"02_maquillajes_rostro/03_Polvos_Colores_Bronceadores_y_Iluminadores/maquillaje_warm_shade_50s_sin_precio_ni_articulo.mp4",

concealers:"02_maquillajes_rostro/04_Correctores/jumbo_concealer_video_elegante.mp4"

};

const video=videoFiles[id]?`<div class="video-frame"><video controls playsinline preload="metadata"><source src="${ROOT+videoFiles[id].split("/").map(encodeURIComponent).join("/")}" type="video/mp4"></video></div>`:"";

let buttons="";

if(id==="sombras1"){

buttons=`<div class="shadow-buttons">

<button class="btn" onclick="openGallery('sombras1')">${t("shadow1")}</button>

<button class="btn" onclick="openGallery('sombras2')">${t("shadow2")}</button>

<button class="btn" onclick="openGallery('sombras3')">${t("shadow3")}</button>

</div>`;

}else{

buttons=`<div class="action"><button class="btn" onclick="openGallery('${id}')">${t("viewProducts")}</button></div>`;

}

return `<section class="collection">

<h2 class="collection-title">${t(c.titleKey)}</h2>

<p class="collection-subtitle">${collectionSubtitle(id)}</p>

${video}

${buttons}

</section>

<div class="separator"></div>`;

}).join("");

}

function openGallery(id){

const collection=collections[id];

if(!collection)return;

activeCollection=collection;

document.getElementById("galleryTitle").textContent=t(collection.titleKey);

document.getElementById("galleryInstruction").textContent=t("choose");

const overview=document.getElementById("galleryOverview");

if(collection.overview){

overview.style.display="block";

overview.src=asset(collection.folder,collection.overview);

overview.alt=t(collection.titleKey);

overview.onerror=function(){this.style.display="none"};

}else{

overview.style.display="none";

}

const grid=document.getElementById("galleryProducts");

grid.innerHTML=collection.products.map((product,index)=>{

const image=asset(collection.folder,product.file);

const name=productName(product);

const price=product.price?`<p>${t("price")}: ${product.price.toFixed(2).replace(".",",")} €</p>`:"";

return `

<article class="product">

<img src="${image}" loading="lazy" alt="${name} ${product.code}" onerror="this.style.display='none'">

<h3>${name}</h3>

<p>${t("code")}: ${product.code}</p>

${price}

<button type="button" class="detail-btn" onclick="openDetail(${index})">${t("details")}</button>

</article>`;

}).join("");

document.getElementById("galleryModal").classList.add("open");

document.body.style.overflow="hidden";

}

function closeGallery(){

document.getElementById("galleryModal").classList.remove("open");

document.body.style.overflow="";

}

function closeGalleryOutside(event){

if(event.target.id==="galleryModal")closeGallery();

}

function openDetail(index){

if(!activeCollection)return;

const product=activeCollection.products[index];

if(!product)return;

document.getElementById("detailTitle").textContent=productName(product);

document.getElementById("detailImage").src=asset(activeCollection.folder,product.file);

document.getElementById("detailCode").textContent=t("code")+": "+product.code;

document.getElementById("detailPrice").textContent=product.price?t("price")+": "+product.price.toFixed(2).replace(".",",")+" €":"";

document.getElementById("detailDescription").textContent=t("description");

document.getElementById("detailWhatsApp").href=whatsappLink(product);

document.getElementById("detailModal").classList.add("open");

}

function closeDetail(){

document.getElementById("detailModal").classList.remove("open");

}

function closeDetailOutside(event){

if(event.target.id==="detailModal")closeDetail();

}

function changeLanguage(lang){

if(!translations[lang])lang="de";

currentLanguage=lang;

document.documentElement.lang=lang;

document.getElementById("language").value=lang;

document.getElementById("introTitle").textContent=t("intro");

document.getElementById("introText").textContent=t("introText");

document.getElementById("footerText").textContent=t("footer");

document.getElementById("footerBrand").textContent=t("footerBrand");

document.querySelectorAll("[data-i18n]").forEach(el=>{

el.textContent=t(el.dataset.i18n);

});

renderSections();

if(activeCollection&&document.getElementById("galleryModal").classList.contains("open")){

const id=Object.keys(collections).find(key=>collections[key]===activeCollection);

if(id)openGallery(id);

}

}

document.getElementById("language").addEventListener("change",function(){

changeLanguage(this.value);

});

document.addEventListener("keydown",function(event){

if(event.key==="Escape"){

closeDetail();

closeGallery();

}

});

renderSections();

changeLanguage("de");

</script>
